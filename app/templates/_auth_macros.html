{% macro icon(name) -%}
<svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>
  {%- elif name == 'at' %}<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>
  {%- elif name == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
  {%- elif name == 'lock' %}<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
  {%- elif name == 'badge' %}<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M14 10h4M14 14h4M5.5 17c.8-1.6 2-2.5 3.5-2.5s2.7.9 3.5 2.5"/>
  {%- elif name == 'eye' %}<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
  {%- elif name == 'eye-off' %}<path d="M3 3l18 18M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6A17.4 17.4 0 0 0 2 12s3.5 7 10 7a10.6 10.6 0 0 0 5.4-1.5M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
  {%- endif %}
</svg>
{%- endmacro %}

{# Floating-label input. `i` staggers its entrance animation. #}
{% macro field(name, label, type='text', ico='user', value='', i=0, autocomplete='', extra='', password=false) -%}
<div class="ff" style="--i: {{ i }}">
  {{ icon(ico) }}
  <input id="{{ name }}" name="{{ name }}" type="{{ type }}" value="{{ value }}" placeholder=" "
         autocomplete="{{ autocomplete }}" {{ extra|safe }}>
  <label for="{{ name }}">{{ label }}</label>
  {% if password %}
    <button class="pw-toggle" type="button" aria-label="Show password" aria-controls="{{ name }}">
      <span class="show">{{ icon('eye') }}</span><span class="hide">{{ icon('eye-off') }}</span>
    </button>
  {% endif %}
</div>
{%- endmacro %}
